<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Science Lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
<div class="jumbotron jumbotron-fluid">
    <div class="container">
        <h1>My Science Lab</h1>
        <p>the jumbotron holds the page title and the four subject buttons</p>
        <button class=" btn btn-primary">Chemestry</button>
        <button class=" btn btn-warning">Biology</button>
        <button class=" btn btn-danger">Physics</button>
        <button class=" btn btn-info">Astronomy</button>
    </div>
</div>
<div class="container">
<h2>Experiment list <span class="badge badge-info">100</span></h2>
<p>Chemestry<span class="badge badge-warning">30</span></p>
<p>Biology<span class="badge badge-danger">20</span></p>
<p>Physics<span class="badge badge-primary">20</span></p>
<p>Astronomy<span class="badge badge-primary">30</span></p>

<h2>Progress...</h2>
<p>Chemestry</p>
<div class="progress mb-3">
<div class="progress-bar bg-primary" style="width: 80%;">80%</div>
</div>
<p>Biology</p>
<div class="progress mb-3">
    <div class="progress-bar bg-warning" style="width: 50%;">50%</div>
</div>
<p>Physics</p>
<div class="progress mb-3">
    <div class="progress-bar bg-danger" style="width: 90%;">90%</div>
</div>
<p>Astronomy</p>
<div class="progress mb-3">
    <div class="progress-bar bg-info" style="width: 60%;">60%</div>
</div>

</div>

</body>

</html>
